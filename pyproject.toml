[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bim-coordination-ai"
version = "0.3.0"
description = "Cloud-ready AI triage service for BIM coordination issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "ifcopenshell",
    "jinja2",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bim_coordination_ai"]
